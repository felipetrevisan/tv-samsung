<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<script>
  // Apple TV's look is always dark: black from the first frame.
  try {
    document.documentElement.style.background = '#000';
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <canvas id="artA" class="art" width="1920" height="1080"></canvas>
    <canvas id="artB" class="art" width="1920" height="1080"></canvas>
    <div class="vshade"></div>
  </div>
  <div id="home" class="layer">
    <div id="hero">
      <div class="text">
        <div class="kicker"></div>
        <div class="name"></div>
        <div class="info"></div>
        <div class="desc"></div>
      </div>
      <div class="bar"><div class="cta glass"><span class="sym"></span><span class="go"></span></div><div class="dots glass"></div></div>
    </div>
    <div id="rows"></div>
    <div id="tabbar"><div class="pill glass"><div class="lens"><i class="l"></i><i class="m"></i><i class="r"></i></div><div class="tabs"></div></div></div>
    <div id="status" class="glass"><span class="wx"></span><span class="time"></span></div>
  </div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="citypick" class="layer sheet"><div class="box"></div></div>
  <div id="keypick" class="layer sheet"><div class="box"></div></div>
  <div id="about" class="layer sheet"><div class="box"></div></div>
  <div id="dim" class="layer"></div>
  <div id="ambient" class="layer"></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
